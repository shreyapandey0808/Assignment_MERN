<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #eef2f8; }

    /* Grid: 2 columns (170px + the rest using fr) with a gap */
    .layout {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 10px;
      min-height: 100vh;
      padding: 10px;
    }

    /* header and footer take both columns */
    header { grid-column: 1 / 3; background: #12203a; color: white; padding: 14px; border-radius: 8px; }
    footer { grid-column: 1 / 3; background: #12203a; color: white; padding: 12px; text-align: center; border-radius: 8px; }
    aside { background: #dbe5fb; padding: 14px; border-radius: 8px; }
    aside li { margin: 8px 0 8px 18px; }
  </style>
</head>
<body>
  <div class="layout">
    <header><h2>My Dashboard</h2></header>

    <aside>
      <h3>Menu</h3>
      <ul>
        <li>Home</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </aside>

    <main>
      <p>Main area</p>
    </main>

    <footer>Made with CSS Grid</footer>
  </div>
</body>
</html>
