<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelEase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; color: #12203a; }

    /* ---------- MOBILE FIRST (default) ---------- */
    nav { padding: 14px; background: #12203a; color: white; text-align: center; }
    nav a { color: white; margin: 0 8px; text-decoration: none; }

    .hero { padding: 40px 16px; text-align: center; background: #2f5bea; color: white; }
    .hero h1 { font-size: 26px; }

    .box { background: #eef2ff; padding: 20px; margin: 16px; border-radius: 10px; text-align: center; }

    footer { background: #12203a; color: white; text-align: center; padding: 16px; }

    /* ---------- TABLET (768px and wider) ---------- */
    @media (min-width: 768px) {
      .hero h1 { font-size: 38px; }
    }

    /* ---------- LAPTOP (1024px and wider) ---------- */
    @media (min-width: 1024px) {
      .hero { padding: 60px 16px; }
    }
  </style>
</head>
<body>
  <nav>
    <h2>TravelEase</h2>
    <div>
      <a href="#">Home</a>
      <a href="#">Trips</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Plan your next trip in minutes</h1>
    <p>Simple, cheap and fun travel plans.</p>
  </section>

  <section class="features">
    <div class="box"><h3>Easy Booking</h3><p>Book in 3 clicks.</p></div>
    <div class="box"><h3>Best Prices</h3><p>We compare for you.</p></div>
    <div class="box"><h3>24x7 Help</h3><p>We are always online.</p></div>
  </section>

  <footer>Made by a first year student</footer>
</body>
</html>
