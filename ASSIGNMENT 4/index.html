<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coding Club</title>
  <style>
    /* * = every element */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #eef2ff; padding: 16px; }

    /* h1 = element selector */
    h1 { font-size: 2.2rem; }

    /* #hero = id selector (only one on the page) */
    #hero {
      background: #2f5bea;
      color: white;
      text-align: center;
      padding: 32px 16px;
      border-radius: 10px;
    }

    /* .card = class selector (use many times) */
    .card {
      background: white;
      padding: 16px;
      margin-top: 16px;
      border-radius: 10px;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { background: #2f5bea; color: white; text-align: left; }
    th, td { padding: 8px; border-bottom: 1px solid #ccd; }
  </style>
</head>
<body>
  <div id="hero">
    <h1>Coding Club</h1>
    <p>Learn. Build. Share.</p>
  </div>

  <div class="card">
    <h2>Upcoming Events</h2>
    <table>
      <tr><th>Event</th><th>Date</th><th>Venue</th></tr>
      <tr><td>HTML Workshop</td><td>12 Nov</td><td>Lab 1</td></tr>
      <tr><td>Hackathon</td><td>20 Nov</td><td>Seminar Hall</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>Register</h2>
    <p>Name: <input type="text" placeholder="Your name"></p>
    <p>Email: <input type="email" placeholder="you@example.com"></p>
    <button>Register</button>
  </div>
</body>
</html>
