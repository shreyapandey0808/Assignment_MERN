<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coding Club</title>
</head>
<body>
  <h1>Coding Club</h1>

  <h2 id="register">Register</h2>
  <form action="#" method="post">
    <p>
      <label for="name">Shreya:</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
    </p>
    <p>
      <label for="email">shreyapandey723@gmail.com:</label>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="pass">Password:</label>
      <input type="password" id="pass" name="pass" required>
    </p>
    <p>
      <label for="dob">8 june 2008:</label>
      <input type="date" id="dob" name="dob">
    </p>
    <p>
      <label for="phone">6247742823:</label>
      <input type="tel" id="phone" name="phone">
    </p>
    <p>
      Gender:
      <input type="radio" name="gender" id="m" value="male"><label for="m">Male</label>
      <input type="radio" name="gender" id="f" value="female"><label for="f">Female</label>
    </p>
    <p>
      Interests:
      <input type="checkbox" id="web" name="interest" value="web"><label for="web">Web</label>
      <input type="checkbox" id="dsa" name="interest" value="dsa"><label for="dsa">DSA</label>
    </p>
    <p>
      <label for="branch">Branch:</label>
      <select id="branch" name="branch">
        <option>BCA</option>
        <option>B.Tech</option>
      </select>
    </p>
    <p>
      <label for="msg">Why do you want to join?</label><br>
      <textarea id="msg" name="msg" rows="3" cols="30"></textarea>
    </p>
    <button type="submit">Register</button>
  </form>
</body>
</html>
