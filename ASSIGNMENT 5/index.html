<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <style>
    /* width will include padding and border (easier maths!) */
    * { box-sizing: border-box; }

    body { margin: 0; font-family: Arial, sans-serif; background: #eef2f8; }

    /* Box model: content + padding + border + margin */
    .card {
      width: 280px;
      margin: 24px auto;
      background: white;
      border: 2px solid #2f5bea;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Your Name</h2>
    <p>Web Developer in Making</p>
  </div>
</body>
</html>
